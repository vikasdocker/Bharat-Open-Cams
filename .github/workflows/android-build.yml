name: Android debug build

on:
  push:
    branches: ["main", "setup/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Find Android SDK Manager
        id: sdk
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "sdkmanager=$sdkmanager_path" >> "$GITHUB_OUTPUT"
      - name: Accept Android SDK licenses
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses
      - name: Install Android API 37 and Build Tools
        run: "${{ steps.sdk.outputs.sdkmanager }}" "platforms;android-37" "build-tools;36.0.0"
      - name: Download and verify Gradle 9.6.0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o gradle.zip
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256 -o gradle.zip.sha256
          expected="$(tr -d '[:space:]' < gradle.zip.sha256)"
          echo "$expected  gradle.zip" | sha256sum --check
          unzip -q gradle.zip
      - name: Assemble debug APK
        run: "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-open-cams-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
