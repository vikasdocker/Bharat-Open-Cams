name: Create draft pre-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Semantic version tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

jobs:
  create-draft:
    name: Create draft release from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release tag and check existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release with tag $RELEASE_TAG already exists." >&2
            exit 1
          fi
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --draft \
            --prerelease \
            --title "Bharat Open Cams $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md