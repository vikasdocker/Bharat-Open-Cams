name: Validate catalog and web assets

on:
  push:
    branches: ["main", "setup/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate feed catalog and authorization gates
        run: python scripts/validate_catalog.py
      - name: Run schema authorization tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check JSON and issue form syntax
        run: |
          python -m json.tool data/feeds.json > /dev/null
          python -m json.tool data/feeds.example.json > /dev/null
          python -m json.tool data/feeds.schema.json > /dev/null
          python -m json.tool data/source-candidates.json > /dev/null
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node tests/web-catalog.test.js
